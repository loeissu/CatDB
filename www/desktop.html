<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆包喵喵 v2.2.0</title>
<style>
:root{
  --bg-color:#F9F5F0; --card-bg:#FFFFFF; --text-main:#333333; --text-light:#666666;
  --accent-orange:#FFB74D; --accent-red:#FF5252; --panel-bg:#F0EDE2; --border-color:#E0D8D0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100vw;height:100vh;overflow:hidden;}
body{font-family:'Microsoft YaHei','SimHei',sans-serif;background:var(--bg-color);color:var(--text-main);display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}
/* 顶部状态栏 */
.status-bar{height:32px;background:var(--card-bg);border-bottom:1px solid var(--border-color);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--text-light);flex-shrink:0;}
.status-dot{width:10px;height:10px;border-radius:50%;margin-right:8px;background:#FF5252;flex-shrink:0;}
.status-dot.on{background:#4CAF50;}
.status-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status-meta{white-space:nowrap;}
.gear-wrap{position:relative;margin-left:8px;}
.gear-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px;}
.gear-btn:hover{background:#F0EDE2;}
.gear-menu{position:absolute;right:0;top:28px;background:#fff;border:1px solid var(--border-color);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px 12px;min-width:220px;display:none;z-index:1000;}
.gear-menu.open{display:block;}
.gear-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;}
.toggle{width:42px;height:22px;border-radius:11px;background:#CCC;border:none;cursor:pointer;position:relative;flex-shrink:0;}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on{background:var(--accent-orange);}
.toggle.on::after{left:22px;}
/* 主体三栏：流式布局 */
.layout{display:flex;flex:1;min-height:0;width:100%;gap:18px;padding:12px 14px;}
.left-panel{flex:0 0 25%;min-width:0;background:var(--panel-bg);border:1px solid var(--border-color);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;}
.center-panel{flex:1;min-width:0;background:var(--card-bg);border:1px solid var(--border-color);border-radius:10px;padding:12px;overflow:auto;display:flex;flex-direction:column;align-items:center;}
.right-panel{flex:0 0 30%;min-width:0;background:var(--panel-bg);border:1px solid var(--border-color);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;}
.panel-title{padding:10px 12px;font-size:13px;font-weight:bold;border-bottom:1px solid var(--border-color);}
.control-panel{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.capsule-btn{width:100%;background:var(--card-bg);border:2px solid var(--border-color);color:var(--text-main);min-height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;cursor:pointer;}
.capsule-btn.active{background:var(--accent-orange);color:#fff;border-color:#FFA726;}
.touchpad-row{display:flex;align-items:center;justify-content:space-between;background:var(--card-bg);border:2px solid var(--border-color);border-radius:12px;padding:8px 10px;font-size:13px;}
.quick-settings{margin-top:auto;padding-top:8px;border-top:1px dashed var(--border-color);}
.quick-setbtn{width:100%;background:none;border:none;color:var(--text-light);min-height:30px;font-size:13px;cursor:pointer;text-align:left;padding:6px 8px;border-radius:6px;}
.quick-setbtn:hover{background:#E8E0D8;}
.qr-section{background:#fff;border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-bottom:12px;width:100%;max-width:340px;text-align:center;}
.qr-section h4{font-size:12px;color:var(--text-light);margin-bottom:8px;}
.qr-image{width:100%;max-width:280px;max-height:280px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:4px;display:block;margin:0 auto;}
.ws-address{background:#F0F0F0;border-radius:6px;padding:8px;margin:0 0 8px 0;font-family:Consolas,monospace;font-size:12px;word-break:break-all;width:100%;max-width:340px;text-align:center;}
.copy-btn{width:100%;max-width:340px;background:var(--accent-orange);color:#fff;border:none;padding:8px;border-radius:6px;font-size:13px;cursor:pointer;}
.copy-btn:hover{background:#FFA726;}
.placeholder{text-align:center;color:var(--text-light);padding:20px;font-style:italic;}
.right-section{padding:10px 12px;border-bottom:1px solid var(--border-color);}
.right-section:last-child{border-bottom:none;flex:1;overflow:auto;}
.section-title{font-size:12px;color:var(--text-light);margin-bottom:8px;padding-bottom:4px;border-bottom:1px dashed var(--border-color);}
.ip-item{padding:6px 8px;font-size:13px;cursor:pointer;border-radius:6px;}
.ip-item:hover{background:#E8E0D8;}
.ip-item.active{color:#E65100;font-weight:bold;background:#FFF3E0;}
/* 底部日志：固定130px，允许垂直拖拽 */
.log-panel{flex-shrink:0;height:130px;min-height:80px;max-height:40vh;resize:vertical;overflow:auto;background:#2D2D2D;border-top:1px solid var(--border-color);color:#E0E0E0;font-family:Consolas,Menlo,monospace;font-size:11px;display:flex;flex-direction:column;}
.log-header{height:24px;background:#3D3D3D;padding:0 8px;display:flex;align-items:center;font-size:11px;color:#B0B0B0;flex-shrink:0;}
.log-header span{flex:1;}
.btn-clear{background:none;border:none;color:#888;cursor:pointer;font-size:11px;}
.btn-clear:hover{color:#FF5555;}
.log-content{flex:1;padding:8px;overflow-y:auto;white-space:pre-wrap;line-height:1.5;}
.log-content .info{color:#B0B0B0;}
.log-content .warn{color:#FFAA00;}
.log-content .error{color:#FF5555;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:2000;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:20px;width:320px;max-width:90vw;max-height:88vh;overflow:auto;}
.modal h3{text-align:center;margin-bottom:14px;}
.modal-btn{width:100%;padding:10px;background:var(--accent-orange);color:#fff;border:none;border-radius:8px;font-size:14px;margin-top:10px;cursor:pointer;}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:3000;}
</style>
</head>
<body>
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">服务未启动</div>
  <div class="status-meta" id="statusMeta">IP -- · 端口 --</div>
  <div class="gear-wrap">
    <button class="gear-btn" id="gearBtn" title="设置">⚙️</button>
    <div class="gear-menu" id="gearMenu">
      <div class="gear-row"><span>开机自启（Windows）</span><button class="toggle" id="autostartToggle"></button></div>
      <div class="gear-row"><span>快捷键设置</span><button class="copy-btn" style="max-width:90px" id="hkBtn2">打开</button></div>
    </div>
  </div>
</div>
<div class="layout">
  <div class="left-panel">
    <div class="panel-title">控制面板</div>
    <div class="control-panel">
      <button class="capsule-btn" id="btnStartStop">▶ 启动服务</button>
      <div class="touchpad-row"><span>🖐️ 触控板模式</span><button class="toggle" id="touchpadToggle"></button></div>
      <div class="quick-settings"><button class="quick-setbtn" id="hkBtn">⌨️ 快捷键设置…</button></div>
    </div>
  </div>
  <div class="center-panel">
    <div class="qr-section">
      <h4>扫码连接（/qr 自动刷新）</h4>
      <img id="qrImage" class="qr-image" alt="二维码" style="display:none">
      <div class="placeholder" id="qrPlaceholder">服务未启动时显示占位提示：请先点击左侧“启动服务”</div>
    </div>
    <div class="ws-address" id="wsAddress">ws://--:--</div>
    <button class="copy-btn" id="copyBtn">复制地址</button>
  </div>
  <div class="right-panel">
    <div class="right-section"><div class="section-title">Zeroconf 服务名</div><div id="zcName" style="font-size:13px">CatDB._catdb._tcp.local.</div></div>
    <div class="right-section"><div class="section-title">可用 IP（点击切换）</div><div id="ipList">正在获取…</div></div>
  </div>
</div>
<div class="log-panel">
  <div class="log-header"><span>日志 INFO/WARN/ERROR</span><button class="btn-clear" id="btnClear">清空</button></div>
  <div class="log-content" id="logContent"><div class="info">— 等待服务启动 —</div></div>
</div>
<div class="modal-overlay" id="hkModal"><div class="modal"><h3>⌨️ 快捷键设置</h3><p style="font-size:13px;color:#666">手机端自定义快捷键（切换窗口/复制/粘贴等）在手机页面设置，本窗口仅为入口占位。</p><button class="modal-btn" id="hkClose">关闭</button></div></div>
<script>
let serviceRunning=false, touchpadOn=false, curIP=null, curPort=null, qrTimer=null;
const $=id=>document.getElementById(id);
const api=()=> (window.pywebview&&window.pywebview.api)?window.pywebview.api:null;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function log(m,cls='info'){const c=$('logContent');const d=document.createElement('div');d.className=cls;const ts=new Date().toLocaleTimeString();d.textContent=`[${ts}] ${m}`;c.appendChild(d);c.scrollTop=c.scrollHeight;while(c.children.length>200)c.removeChild(c.firstChild);}
$('btnClear').onclick=()=>{$('logContent').innerHTML='';};
$('gearBtn').onclick=e=>{e.stopPropagation();$('gearMenu').classList.toggle('open');};
document.addEventListener('click',()=>$('gearMenu').classList.remove('open'));
$('hkBtn').onclick=()=>$('hkModal').classList.add('open');
$('hkBtn2').onclick=()=>{$('gearMenu').classList.remove('open');$('hkModal').classList.add('open');};
$('hkClose').onclick=()=>$('hkModal').classList.remove('open');
$('hkModal').onclick=e=>{if(e.target.id==='hkModal')e.target.classList.remove('open');};
$('touchpadToggle').onclick=async function(){
  touchpadOn=!touchpadOn;this.classList.toggle('on',touchpadOn);
  log('触控板模式：'+(touchpadOn?'开启':'关闭'));
  try{if(api()&&api().toggle_touchpad)await api().toggle_touchpad(touchpadOn);}catch(e){log('toggle_touchpad 调用失败：'+e,'warn');}
  toast(touchpadOn?'触控板已开启':'触控板已关闭');
};
$('autostartToggle').onclick=async function(){
  const next=!this.classList.contains('on');this.classList.toggle('on',next);
  try{if(api()&&api().toggle_autostart)await api().toggle_autostart(next);
  else if(api()&&api().set_auto_start)await api().set_auto_start(next);}catch(e){log('开机自启切换失败：'+e,'warn');}
  log('开机自启：'+(next?'开':'关'));toast(next?'开机自启已开启':'开机自启已关闭');
};
$('btnStartStop').onclick=async ()=>{
  serviceRunning=!serviceRunning;
  $('btnStartStop').textContent=serviceRunning?'⏹ 停止服务':'▶ 启动服务';
  $('btnStartStop').classList.toggle('active',serviceRunning);
  try{if(api()){if(serviceRunning&&api().start_service)await api().start_service();if(!serviceRunning&&api().stop_service)await api().stop_service();}}catch(e){}
  setRunningUI(serviceRunning);log(serviceRunning?'服务启动':'服务停止');
};
function setRunningUI(on){
  $('statusDot').classList.toggle('on',on);
  $('statusText').textContent=on?'服务运行中':'服务未启动';
  $('qrImage').style.display=on?'block':'none';
  $('qrPlaceholder').style.display=on?'none':'block';
  if(on){refreshAddr();startQR();fetchIPs();}else{stopQR();$('wsAddress').textContent='ws://--:--';$('statusMeta').textContent='IP -- · 端口 --';}
}
function refreshAddr(){
  if(curIP&&curPort){$('wsAddress').textContent=`ws://${curIP}:${curPort}`;$('statusMeta').textContent=`本机 ${curIP} · 端口 ${curPort}`;}
}
function startQR(){stopQR();updQR();qrTimer=setInterval(updQR,5000);}
function stopQR(){if(qrTimer){clearInterval(qrTimer);qrTimer=null;}}
function updQR(){if(!serviceRunning)return;const p=curPort||5000;$('qrImage').src=`/qr?t=${Date.now()}`;$('qrImage').onerror=()=>{$('qrImage').src=`http://127.0.0.1:${p}/qr?t=${Date.now()}`;};}
$('copyBtn').onclick=async ()=>{
  const t=$('wsAddress').textContent;
  try{await navigator.clipboard.writeText(t);toast('地址已复制');}
  catch(e){try{if(api()&&api().copy_to_clipboard)await api().copy_to_clipboard(t);}catch(_){}toast('已尝试复制');}
};
async function fetchIPs(){
  try{
    if(api()&&api().get_ip_list){const r=await api().get_ip_list();renderIPs(r.ips||[]);}
    if(api()&&api().get_port){const r=await api().get_port();if(r.port)curPort=r.port;}
    if(!curIP){const ips=[...document.querySelectorAll('.ip-item')].map(e=>e.dataset.ip);if(ips.length)curIP=ips[0];}
    refreshAddr();
  }catch(e){log('获取 IP 失败：'+e,'warn');}
}
function renderIPs(ips){
  const box=$('ipList');box.innerHTML='';
  if(!ips.length){box.innerHTML='<div style="font-size:12px;color:#888">无可用 IP</div>';return;}
  ips.forEach((ip,i)=>{
    const d=document.createElement('div');d.className='ip-item'+(i===0?' active':'');d.textContent=ip;d.dataset.ip=ip;
    d.onclick=()=>{document.querySelectorAll('.ip-item').forEach(e=>e.classList.remove('active'));d.classList.add('active');curIP=ip;refreshAddr();updQR();log('切换 IP：'+ip);};
    box.appendChild(d);
  });
  if(!curIP)curIP=ips[0];
}
async function initAutostart(){
  try{
    let r=null;
    if(api()&&api().get_autostart_status)r=await api().get_autostart_status();
    else if(api()&&api().get_auto_start)r=await api().get_auto_start();
    if(r&&r.enabled)$('autostartToggle').classList.add('on');
  }catch(e){}
}
window.addEventListener('pywebviewready',()=>{fetchIPs();initAutostart();log('桌面 GUI 已加载 920x660 resizable');});
window.addEventListener('load',()=>{setTimeout(()=>{if(window.pywebview){fetchIPs();initAutostart();}},500);});
</script>
</body>
</html>
